<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        function isBenign(item) {
          if (!item) return false;
          var text = (item.message || item.reason?.message || item.reason || item.description || String(item)).toLowerCase();
          return text.indexOf('websocket') !== -1 || text.indexOf('[vite]') !== -1 || text.indexOf('vite-hmr') !== -1;
        }
        var origConsoleError = console.error;
        console.error = function() {
          var text = Array.prototype.slice.call(arguments).map(function(arg) {
            return (arg && arg.message) || String(arg || '');
          }).join(' ').toLowerCase();
          if (text.indexOf('[vite]') !== -1 || text.indexOf('websocket closed without opened') !== -1 || text.indexOf('failed to connect to websocket') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(e) {
          if (isBenign(e.reason) || isBenign(e)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (isBenign(e.error) || isBenign(e.message) || isBenign(e)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
    <title>Pythagoras Tutor</title>
    <meta name="description" content="An interactive voice AI teacher with an animated tutor character that dynamically generates lessons, concept diagrams, chalk notes, and quizzes for any subject, topic, and grade level in real time." />
    <meta property="og:title" content="Pythagoras Tutor" />
    <meta property="og:description" content="An interactive voice AI teacher with an animated tutor character that dynamically generates lessons, concept diagrams, chalk notes, and quizzes for any subject, topic, and grade level in real time." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
